name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/generate.mjs --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx --yes markdownlint-cli2 "README.md" "NOTICE.md" "SECURITY.md" "CHANGELOG.md" "docs/**/*.md"
      - run: npx --yes github-actionlint

  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "list=$(jq -c '.vibe.tested' package.json)" >> "$GITHUB_OUTPUT"

  compat:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        vibe: ${{ fromJSON(needs.versions.outputs.list) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
      - run: uv tool install mistral-vibe==${{ matrix.vibe }}
      - run: node bin/pstack-vibe.mjs verify

  drive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
      - run: uv tool install mistral-vibe==3.1.2
      - run: node scripts/mock-drive.mjs
