name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:shell
      - run: node scripts/generate.mjs --check
      - run: brew install shellcheck
        if: runner.os == 'macOS'
      - run: shellcheck scripts/*.sh generated/vibe/ai.mistral.vibe/scripts/*.sh
      - run: npx --yes markdownlint-cli2 "README.md" "NOTICE.md" "SECURITY.md" "CHANGELOG.md" "docs/**/*.md"
      - run: npx --yes github-actionlint
